services:
  wazuh-connector:
    image: piervuln-wazuh-sync:mhomolog
    build:
      context: ../..
      dockerfile: connector/Dockerfile
    network_mode: host
    mem_limit: 512m
    init: true
    restart: unless-stopped
    stop_grace_period: 3m
    command: ["pnpm", "connector:daemon"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Defina SUPABASE_URL no ambiente do worker}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Defina SUPABASE_PUBLISHABLE_KEY no ambiente do worker}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      CONNECTOR_CONNECTIONS_DIR: /run/piervuln/connections
      NODE_EXTRA_CA_CERTS: /etc/wazuh/certs/indexers-ca-bundle.pem
    volumes:
      - /opt/piervuln/config/connections:/run/piervuln/connections:ro
      - /opt/piervuln/config/indexers-ca-bundle.pem:/etc/wazuh/certs/indexers-ca-bundle.pem:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
