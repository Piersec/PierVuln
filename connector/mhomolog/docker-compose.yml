services:
  wazuh-connector:
    image: piervuln-wazuh-sync:mhomolog
    build:
      context: ../..
      dockerfile: connector/Dockerfile
    network_mode: host
    mem_limit: 512m
    init: true
    restart: unless-stopped
    stop_grace_period: 3m
    command: ["pnpm", "connector:daemon"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Defina SUPABASE_URL no ambiente do worker}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Defina SUPABASE_PUBLISHABLE_KEY no ambiente do worker}
      WAZUH_WORKER_CONFIG_TOKEN: ${WAZUH_WORKER_CONFIG_TOKEN:?Defina WAZUH_WORKER_CONFIG_TOKEN no ambiente do worker}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      WORKER_CONFIG_POLL_SECONDS: ${WORKER_CONFIG_POLL_SECONDS:-300}
      INDEXER_PAGE_SIZE: ${INDEXER_PAGE_SIZE:-500}
      INDEXER_PAGE_DELAY_MS: ${INDEXER_PAGE_DELAY_MS:-250}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
