services:
  wazuh-connector:
    image: piervuln-wazuh-sync:local
    build:
      context: ../..
      dockerfile: connector/Dockerfile
    platform: linux/arm64
    network_mode: host
    mem_limit: 512m
    init: true
    command: ["pnpm", "connector:job"]
    env_file:
      - ${CONNECTOR_ENV_FILE:-../.env}
    environment:
      NODE_EXTRA_CA_CERTS: ${WAZUH_INDEXER_CA_FILE:-/etc/wazuh/certs/indexer-ca.pem}
    volumes:
      - ../certs:/etc/wazuh/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
